# Configuração do golangci-lint
# Documentação: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  # Não rodar em vendor/
  issues:
    exclude-dirs:
      - vendor

output:
  formats:
    - format: colored-line-number
      path: stdout
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  # Verifica erros comuns
  errcheck:
    check-type-assertions: true
    check-blank: true

  # Verifica formatação
  gofmt:
    simplify: true

  # Verifica imports não utilizados
  goimports:
    local-prefixes: github.com/vagnerbarbosa/vagnerbarbosa.github.io

  # Verifica código complexo
  gocyclo:
    min-complexity: 15

  # Verifica linhas muito longas
  lll:
    line-length: 120

  # Verifica funções muito longas
  funlen:
    lines: 60
    statements: 40

  # Verifica duplicação
  dupl:
    threshold: 100

linters:
  enable:
    # Linters oficiais Go
    - gofmt
    - goimports
    - govet
    - gosimple
    - staticcheck
    - errcheck
    - ineffassign
    - typecheck

    # Linters adicionais recomendados
    - gocyclo
    - lll
    - misspell
    - unconvert
    - unused
    - whitespace
    - dupl
    - funlen
    - gocritic
    - godot
    - prealloc

  disable:
    # Desabilitados intencionalmente
    - deadcode      # Replaced by unused
    - structcheck   # Replaced by unused
    - varcheck      # Replaced by unused

issues:
  # Excluir alguns padrões comuns
  exclude-rules:
    # Ignorar erros de documentação em testes
    - path: _test\.go
      linters:
        - dupl
        - lll
        - funlen

    # Ignorar linha longa em arquivos de configuração
    - path: config\.yaml
      linters:
        - lll

  # Não usar exclude padrão para ver tudo
  exclude-use-default: false

  # Máximo de issues por linter
  max-issues-per-linter: 50

  # Máximo de issues do mesmo tipo
  max-same-issues: 10
