# Configuração do golangci-lint v2
# Documentação: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

output:
  formats:
    text:
      path: stdout
  print-issued-lines: true
  print-linter-name: true

linters:
  default: none
  enable:
    # Linters oficiais Go
    - gofmt
    - goimports
    - govet
    - gosimple
    - staticcheck
    - errcheck
    - ineffassign

    # Linters adicionais recomendados
    - gocyclo
    - lll
    - misspell
    - unconvert
    - unused
    - whitespace
    - dupl
    - funlen
    - gocritic
    - godot
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/vagnerbarbosa/vagnerbarbosa.github.io

  gocyclo:
    min-complexity: 15

  lll:
    line-length: 120

  funlen:
    lines: 60
    statements: 40

  dupl:
    threshold: 100

issues:
  exclude-dirs:
    - vendor

  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - lll
        - funlen

    - path: config\.yaml
      linters:
        - lll

  max-issues-per-linter: 50
  max-same-issues: 10
