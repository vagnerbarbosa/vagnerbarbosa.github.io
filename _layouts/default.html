<!DOCTYPE html>
<html lang="en" data-theme="light">
  {% include head.html %}
  <body>
    <div class="container">
      {% include header.html %}
      <main>
        {% include about.html %}
      </main>
      {% include footer.html %}
    </div>
    <script>
      // Theme toggle functionality
      (function() {
        const html = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const themeText = document.getElementById('theme-text');

        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        updateThemeText(currentTheme);

        themeToggle.addEventListener('click', function() {
          const currentTheme = html.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';

          html.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          updateThemeText(newTheme);
        });

        function updateThemeText(theme) {
          themeText.textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
        }
      })();

      // Language toggle functionality
      (function() {
        const langToggle = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');
        const html = document.documentElement;

        // Check for saved language preference or default to 'pt'
        const currentLang = localStorage.getItem('lang') || 'pt';
        html.setAttribute('lang', currentLang === 'pt' ? 'pt-BR' : 'en');
        updateLanguage(currentLang);

        langToggle.addEventListener('click', function() {
          const currentLang = html.getAttribute('lang') === 'pt-BR' ? 'pt' : 'en';
          const newLang = currentLang === 'pt' ? 'en' : 'pt';

          html.setAttribute('lang', newLang === 'pt' ? 'pt-BR' : 'en');
          localStorage.setItem('lang', newLang);
          updateLanguage(newLang);
        });

        function updateLanguage(lang) {
          langText.textContent = lang === 'pt' ? 'EN' : 'PT';

          // Toggle visibility of language elements
          document.querySelectorAll('.lang-pt').forEach(el => {
            el.style.display = lang === 'pt' ? '' : 'none';
          });
          document.querySelectorAll('.lang-en').forEach(el => {
            el.style.display = lang === 'en' ? '' : 'none';
          });
        }
      })();

      // Accordion functionality
      (function() {
        document.querySelectorAll('.accordion-header').forEach(button => {
          button.addEventListener('click', function() {
            const accordion = this.parentElement;
            const isExpanded = accordion.classList.contains('expanded');

            // Close all accordions
            document.querySelectorAll('.accordion').forEach(acc => {
              acc.classList.remove('expanded');
            });

            // Open clicked accordion if it wasn't expanded
            if (!isExpanded) {
              accordion.classList.add('expanded');
            }
          });
        });
      })();
    </script>
  </body>
</html>
