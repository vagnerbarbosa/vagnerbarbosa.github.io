<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  {% include head.html %}
  <head>
    <!-- Subresource Integrity (SRI) recomendado para produção -->
    <!-- Exemplo: <script src="file.js" integrity="sha384-..." crossorigin="anonymous"></script> -->

    <!-- Content Security Policy (ajustar conforme necessidade) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self';
    ">
  </head>

  <body>
    <div class="container">
      {% include header.html %}
      <main>
        {% include about.html %}
      </main>
      {% include footer.html %}
    </div>

    <!-- Scripts externos com defer para performance -->
    <!-- Ordem: Utils → Módulos → App -->
    <script src="{{ '/assets/js/utils.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/i18n.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/accordion.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>

    <!-- Noscript fallback para acessibilidade -->
    <noscript>
      <style>
        .lang-en { display: none !important; }
        .accordion .accordion-content { max-height: none !important; padding: 24px 0 !important; }
        .accordion-header { cursor: default !important; }
        .accordion-icon { display: none !important; }
      </style>
    </noscript>
  </body>
</html>
