{{define "index"}}<!DOCTYPE html>
<html lang="en" data-theme="dark">
{{template "head" .}}
<body>
  <a href="#main-content" class="skip-link">
    <span class="lang-pt">Pular para conteúdo principal</span>
    <span class="lang-en" style="display: none;">Skip to main content</span>
  </a>
  <div class="container">
    {{template "header" .}}
    <main id="main-content" tabindex="-1">
      {{template "about" .}}
      {{template "experience" .}}
      {{template "skills" .}}
      {{template "education" .}}
      {{template "contact" .}}
    </main>
    {{template "footer" .}}
  </div>

  <script src="/assets/js/utils.js" defer></script>
  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/accordion.js" defer></script>
  <script src="/assets/js/app.js" defer></script>

  <noscript>
    <style>
      .lang-pt { display: none !important; }
      .lang-en { display: inline !important; }
      .accordion .accordion-content { max-height: none !important; padding: 24px 0 !important; }
      .accordion-header { cursor: default !important; }
      .accordion-icon { display: none !important; }
    </style>
  </noscript>
</body>
</html>{{end}}
