{{define "skills"}}
{{if .Content.Technologies}}
<div class="accordion fade-in fade-in-delay-3" id="skills" role="region" aria-label="Tecnologias e habilidades">
  <button class="accordion-header" aria-expanded="false" aria-controls="skills-content">
    <span class="accordion-header-content">
      <span class="lang-pt"><span class="bracket">[</span>Tecnologias<span class="bracket">]</span></span>
      <span class="lang-en" style="display: none;"><span class="bracket">[</span>Tech Stack<span class="bracket">]</span></span>
    </span>
    <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <div class="accordion-content" id="skills-content">
    <div class="accordion-content-inner">
      <div class="tech-grid">
{{range .Content.Technologies}}
        <div class="tech-item">{{.}}</div>
{{end}}
      </div>
    </div>
  </div>
</div>
{{end}}
{{end}}
