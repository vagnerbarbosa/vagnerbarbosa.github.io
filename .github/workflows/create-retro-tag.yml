name: Create Retroactive Tag

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA para a tag retroativa'
        required: true
        type: string
      tag:
        description: 'Nome da tag (ex: v1.0.0)'
        required: true
        type: string
      create_release:
        description: 'Criar release para esta tag?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Retroactive Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        run: |
          # Validar formato da tag (deve seguir semver: vX.Y.Z)
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Erro: Tag deve seguir formato semver (vX.Y.Z)"
            exit 1
          fi

          # Validar se SHA existe
          if ! git cat-file -e ${{ github.event.inputs.sha }}^{commit} 2>/dev/null; then
            echo "❌ Erro: SHA ${{ github.event.inputs.sha }} não encontrado no histórico"
            exit 1
          fi

          # Validar se tag já existe
          if git rev-parse "refs/tags/${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "❌ Erro: Tag ${{ github.event.inputs.tag }} já existe"
            exit 1
          fi

          echo "✅ Validações passaram"

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Criar tag apontando para o SHA especificado
          git tag -a ${{ github.event.inputs.tag }} ${{ github.event.inputs.sha }} -m "Release ${{ github.event.inputs.tag }}"

          # Push da tag
          git push origin ${{ github.event.inputs.tag }}

          echo "✅ Tag ${{ github.event.inputs.tag }} criada apontando para ${{ github.event.inputs.sha }}"

      - name: Generate Changelog
        if: github.event.inputs.create_release == 'true'
        id: changelog
        run: |
          chmod +x .github/scripts/generate-changelog.sh

          # Tentar encontrar tag anterior para comparação
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.event.inputs.sha }}^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Comparando com tag anterior: $PREVIOUS_TAG"
            CHANGELOG=$(.github/scripts/generate-changelog.sh ${{ github.event.inputs.tag }} "$PREVIOUS_TAG")
          else
            echo "Primeira tag - sem comparação anterior"
            CHANGELOG="## Release ${{ github.event.inputs.tag }}\n\nTag criada retroativamente para documentar versão histórica."
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Tag Retroativa Criada"
          echo ""
          echo "- **Tag:** ${{ github.event.inputs.tag }}"
          echo "- **SHA:** ${{ github.event.inputs.sha }}"
          echo "- **Release:** ${{ github.event.inputs.create_release == 'true' && 'Sim' || 'Não' }}"
          echo ""
          echo "Ver no GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag }}"
