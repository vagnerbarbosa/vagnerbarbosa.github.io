name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # Necessário para criar tags
  actions: read     # Para verificar status de workflows

jobs:
  # Job 1: Analisar commits e criar tag
  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Determine next version
        working-directory: .github/scripts
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obter última tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Última tag: $LAST_TAG"

          # Analisar commits desde a última tag
          COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s" 2>/dev/null || echo "")

          # Verificar se há commits convencionais (incluindo breaking changes com !)
          if echo "$COMMITS" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?!?:"; then
            echo "✅ Commits convencionais encontrados"

            # Determinar tipo de versão
            if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
              VERSION_TYPE="major"
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              VERSION_TYPE="minor"
            else
              VERSION_TYPE="patch"
            fi

            echo "Tipo de versão: $VERSION_TYPE"

            # Calcular próxima versão
            CURRENT_VERSION=${LAST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            if [ "$VERSION_TYPE" = "major" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$VERSION_TYPE" = "minor" ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            echo "new_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "✅ Nova versão: v${NEW_VERSION}"
          else
            echo "new_tag=" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
            echo "⚠️ Nenhum commit convencional encontrado"
          fi

      - name: Create Tag
        if: steps.tag.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.tag.outputs.new_tag }} -m "Release ${{ steps.tag.outputs.new_tag }}"
          git push origin ${{ steps.tag.outputs.new_tag }}
          echo "✅ Tag criada: ${{ steps.tag.outputs.new_tag }}"

  # Job 2: Aguardar deploy e criar release
  release:
    name: Create Release
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for deploy with polling
        id: deploy
        run: |
          echo "⏳ Aguardando deploy do GitHub Pages..."

          # Polling com backoff: 10 tentativas, 15s entre cada
          for i in {1..10}; do
            echo "🔍 Tentativa $i/10..."

            DEPLOY_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.status' || echo "")

            if [ "$DEPLOY_STATUS" == "built" ]; then
              echo "success=true" >> $GITHUB_OUTPUT
              echo "✅ Deploy concluído com sucesso"
              exit 0
            fi

            echo "⏳ Status atual: ${DEPLOY_STATUS:-unknown}. Aguardando 15s..."
            sleep 15
          done

          echo "success=false" >> $GITHUB_OUTPUT
          echo "⚠️ Timeout após 10 tentativas. Deploy pode estar em andamento."
        continue-on-error: true

      - name: Generate Changelog
        id: changelog
        run: |
          chmod +x .github/scripts/generate-changelog.sh

          # Obter última tag anterior
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ needs.tag.outputs.new_tag }}^ 2>/dev/null || echo "")

          # Gerar changelog
          CHANGELOG=$(.github/scripts/generate-changelog.sh ${{ needs.tag.outputs.new_tag }} "$PREVIOUS_TAG")

          # Escapar para GitHub Actions
          CHANGELOG_ESCAPED="${CHANGELOG//'%'/'%25'}"
          CHANGELOG_ESCAPED="${CHANGELOG_ESCAPED//$'\n'/'%0A'}"
          CHANGELOG_ESCAPED="${CHANGELOG_ESCAPED//$'\r'/'%0D'}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Changelog gerado"

      - name: Create GitHub Release
        if: steps.deploy.outputs.success != 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log skipped release
        if: steps.deploy.outputs.success == 'false'
        run: |
          echo "⚠️ Release não criada - deploy falhou ou não foi confirmado"
          echo "Tag ${{ needs.tag.outputs.new_tag }} permanece disponível para retry"
